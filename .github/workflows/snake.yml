name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: senujalinal
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%23A78BFA
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2334D399&color_dots=%23161b22,%23312e81,%236d28d9,%23a78bfa,%23f59e0b

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
